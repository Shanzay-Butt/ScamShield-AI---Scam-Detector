[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline", "models", "config", "ml"]

[project]
name = "scam-detector-api"
version = "1.0.0"
description = "AI Scam Detector — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.1",
    "orjson>=3.10.3",
    "httpx>=0.27.0",
    "redis>=5.0.4",
    "aiodns>=3.2.0",
    "openai>=1.30.1",
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "pyahocorasick>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "circuitbreaker>=2.0.0",
    "structlog>=24.2.0",
    "pyyaml>=6.0.1",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.23.2",
    "anyio[trio]>=4.4.0",
    "httpx>=0.27.0",
    "respx>=0.21.1",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
